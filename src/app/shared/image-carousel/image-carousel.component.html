<swiper-container appSwiper [config]="sliderOpts">
  <swiper-slide
    *ngFor="let image of backgroundImages; let i = index"
    (click)="onSelectImage(i)"
  >
    <div
      class="image-card"
      [class.active]="images[i] === selectedImage"
      [style.background-image]="image"
    ></div>
  </swiper-slide>
</swiper-container>
